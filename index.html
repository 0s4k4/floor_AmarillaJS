<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>黄色い花 · ramo · día · tarde · noche</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1226;
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  #c{display:block;width:100vw;height:100vh}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:#12203c;color:#e8dfc8;z-index:40;
    transition:opacity .7s}
  #load b{font-weight:400;letter-spacing:.34em;font-size:12px;opacity:.75}
  #barw{width:190px;height:2px;background:rgba(232,223,200,.2)}
  #bar{width:0;height:100%;background:#f0d48a;transition:width .18s}
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    justify-content:center;gap:7px;padding:14px 10px calc(14px + env(safe-area-inset-bottom));
    flex-wrap:wrap;transition:opacity .5s}
  .btn{font:inherit;font-size:11.5px;letter-spacing:.13em;color:#3a3524;
    background:rgba(255,252,240,.62);border:1px solid rgba(90,80,55,.28);
    border-radius:2px;padding:7px 12px;cursor:pointer;backdrop-filter:blur(2px)}
  .btn.on{background:rgba(255,240,190,.92);border-color:rgba(120,95,40,.5)}
  .btn:active{transform:translateY(1px)}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:30;
    font-size:10.5px;letter-spacing:.28em;color:rgba(255,250,235,.72);
    text-shadow:0 1px 3px rgba(20,15,5,.55);transition:opacity .5s}
  #panel{position:fixed;z-index:25;right:calc(20px + env(safe-area-inset-right));
    top:12%;display:flex;align-items:flex-start;gap:16px;transition:opacity .8s;
    pointer-events:none}
  #kanji{writing-mode:vertical-rl;font-size:clamp(19px,2.4vw,26px);letter-spacing:.5em;
    color:#4a4230;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  #sub{writing-mode:vertical-rl;font-size:11px;letter-spacing:.34em;color:#5b5340;
    margin-top:4px}
  .dark #kanji,.dark #sub{color:#efe6cc;text-shadow:0 1px 6px rgba(5,10,30,.7)}
  .dark .btn{color:#e9e2cd;background:rgba(20,30,54,.5);border-color:rgba(230,220,190,.28)}
  .dark .btn.on{background:rgba(60,80,130,.75);border-color:rgba(240,225,180,.55)}
  #hint{position:fixed;bottom:56px;left:0;right:0;text-align:center;z-index:29;
    font-size:10px;letter-spacing:.24em;color:rgba(255,250,235,.6);
    text-shadow:0 1px 3px rgba(20,15,5,.5);transition:opacity 1s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div id="kanji">黄色い花</div>
  <div>
    <div id="sub">septiembre · 九月</div>
  </div>
</div>

<div id="hud">— · —</div>
<div id="hint">mueve el teléfono · toca para pétalos</div>

<div id="ui">
  <button class="btn" data-m="0">día</button>
  <button class="btn" data-m="1">tarde</button>
  <button class="btn" data-m="2">noche</button>
  <button class="btn on" data-m="auto">auto</button>
  <button class="btn" id="gyro">sensor</button>
</div>

<div id="load"><b>ATANDO EL RAMO</b><div id="barw"><div id="bar"></div></div></div>

<script>
"use strict";
/* ============================================================
   黄色い花 — RAMO de nanohana, acuarela Ghibli procedural
   día · tarde · noche  +  giroscopio en el ramo
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,QS=2;
const QCFG={1:{dpr:1.0,fl:70, gr:180,pt:16,ff:14},
            2:{dpr:1.35,fl:140,gr:340,pt:26,ff:22},
            3:{dpr:1.7,fl:210,gr:520,pt:38,ff:30}};

/* ---------- azar determinista + ruido de valor ---------- */
function seedR(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=seedR(210921);
const NS=256, NG=new Float32Array(NS*NS);
(function(){const r=seedR(7);for(let i=0;i<NS*NS;i++)NG[i]=r();})();
function vn(px,py){
  const x0=Math.floor(px),y0=Math.floor(py),fx=px-x0,fy=py-y0;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const i=(x0&255)+((y0&255)<<8), j=((x0+1)&255)+((y0&255)<<8),
        k=(x0&255)+(((y0+1)&255)<<8), l=((x0+1)&255)+(((y0+1)&255)<<8);
  const a=NG[i]+(NG[j]-NG[i])*sx, b=NG[k]+(NG[l]-NG[k])*sx;
  return a+(b-a)*sy;
}
function fbm(px,py,o){let v=0,a=.5,f=1;o=o||3;
  for(let i=0;i<o;i++){v+=a*vn(px*f,py*f);f*=2.03;a*=.5;}return v;}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;

/* ---------- color ---------- */
function hx(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),
  parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(c1,c2,t){const a=hx(c1),b=hx(c2);
  return 'rgb('+(a[0]+(b[0]-a[0])*t|0)+','+(a[1]+(b[1]-a[1])*t|0)+','+(a[2]+(b[2]-a[2])*t|0)+')';}
function rgba(h,a){const c=hx(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

/* ============================================================
   PALETAS: los tres momentos del día
   ============================================================ */
const PAL=[
{ id:'día', label:'午前 · MAÑANA CLARA', dark:false,
  sky:['#6fb0dd','#a3d2ec','#d6e9ee','#eef3e6'],
  wet:['#8cc4e4','#bcdcec','#e6eedf'],
  orb:{x:.24,y:.16,r:.10,warm:'#fffdf0',glow:'#fff8d8',ga:.5},
  cloud:{body:'#ffffff',shade:'#c3d6e4',edge:'#fff6dc'},
  mtn:{snow:'#f6f8fb',rock:'#8fa6bd',shade:'#6d87a4',mist:'#dfeaf0'},
  hill:['#9dc0a4','#7fae86','#63976c','#4b7f58'],
  field:['#b9cf7a','#9dbb63','#86a852'],
  dots:['#ffe45e','#ffd936','#fff09a','#f7cb2e'],
  stem:'#5f8a44', stem2:'#4d7538',
  fl:{p1:'#ffe770',p2:'#ffd52e',core:'#f6a91e',edge:'#d9a114'},
  petal:'#ffdf55', path:'#cdb98a', pathS:'#b09e72',
  wrap:{a:'#f2e8d0', b:'#c2a878', r:'#c9684e'},
  amb:'#ffffff', ambA:0, star:0, ff:0, hazeA:.10, haze:'#eaf4ff' },
{ id:'tarde', label:'夕方 · ATARDECER', dark:false,
  sky:['#5f6fa8','#c98a76','#f3ac6c','#ffe0a8'],
  wet:['#8a7fae','#e59a70','#ffcf94'],
  orb:{x:.70,y:.60,r:.13,warm:'#fff1c0',glow:'#ffb95e',ga:.85},
  cloud:{body:'#f7d5b4',shade:'#a98099',edge:'#ffe9b0'},
  mtn:{snow:'#ffe7cf',rock:'#8e7b9a',shade:'#6a5a80',mist:'#f3cfae'},
  hill:['#c79a76','#a67f6b','#7d6560','#5a4b52'],
  field:['#d9b463','#c09a4d','#a3803e'],
  dots:['#ffd25c','#ffb43a','#ffe9a0','#e89a28'],
  stem:'#7a6a34', stem2:'#5e5127',
  fl:{p1:'#ffdc7a',p2:'#ffb244',core:'#e07a1c',edge:'#b8701a'},
  petal:'#ffc457', path:'#c4a276', pathS:'#9d8059',
  wrap:{a:'#f5dcb8', b:'#bf9468', r:'#b3543d'},
  amb:'#ffb765', ambA:.16, star:0, ff:.15, hazeA:.20, haze:'#ffd9a0' },
{ id:'noche', label:'夜 · NOCHE DE LUNA', dark:true,
  sky:['#080f24','#122043','#22345f','#3d5075'],
  wet:['#101d3d','#1b2c52','#2c4066'],
  orb:{x:.76,y:.18,r:.055,warm:'#f6f8ff',glow:'#cfe0ff',ga:.42},
  cloud:{body:'#2a3a60',shade:'#16223f',edge:'#8fa4cc'},
  mtn:{snow:'#c9d6ec',rock:'#3d4c6e',shade:'#28334f',mist:'#22304f'},
  hill:['#2c3f5c','#26364f','#1d2b40','#151f30'],
  field:['#2e3f48','#26343c','#1d2930'],
  dots:['#c9c98a','#a8ab6e','#e2dfa8','#8f9160'],
  stem:'#3b4a3a', stem2:'#2c3a2d',
  fl:{p1:'#dcd79a',p2:'#b8b46a',core:'#8a7f40',edge:'#6b6537'},
  petal:'#cfc98c', path:'#4a4a48', pathS:'#33342f',
  wrap:{a:'#48526e', b:'#282f47', r:'#7a4450'},
  amb:'#4a6ba8', ambA:.30, star:1, ff:1, hazeA:.16, haze:'#3f5a8c' }
];

/* ============================================================
   MOTOR DE ACUARELA (sólo se usa al hornear, nunca en el bucle)
   ============================================================ */
let BLEND='multiply';
function nc(w,h){const k=document.createElement('canvas');k.width=Math.max(1,w|0);
  k.height=Math.max(1,h|0);return k;}
function blobPath(g,cx,cy,r,wob,sd,ry,n){
  n=n||16; g.beginPath();
  for(let i=0;i<=n;i++){
    const a=i/n*TAU, c=Math.cos(a), s=Math.sin(a);
    const rr=r*(1+(fbm(c*1.6+sd*3.1,s*1.6+sd*2.3,3)-.5)*wob);
    const px=cx+c*rr, py=cy+s*rr*(ry===undefined?.92:ry);
    if(i)g.lineTo(px,py); else g.moveTo(px,py);
  }
  g.closePath();
}
function wash(g,mk,col,al,passes,jit){
  g.save(); g.globalCompositeOperation=BLEND;
  for(let i=0;i<passes;i++){
    g.save(); g.translate((R()-.5)*jit,(R()-.5)*jit);
    g.globalAlpha=al*(.5+.5*R()); g.fillStyle=col; mk(g); g.fill(); g.restore();
  }
  g.globalAlpha=al*.55; g.strokeStyle=col; g.lineWidth=1.4+R()*1.2; mk(g); g.stroke();
  g.restore();
}
function granul(g,x0,y0,w,h,col,n,al){
  g.save(); g.globalCompositeOperation=BLEND; g.fillStyle=col;
  for(let i=0;i<n;i++){
    g.globalAlpha=al*R();
    const px=x0+R()*w, py=y0+R()*h, s=.7+R()*1.6;
    g.fillRect(px,py,s,s);
  }
  g.restore();
}
function ridge(g,w,h,base,amp,freq,sd){
  g.beginPath(); g.moveTo(-4,h+8);
  for(let px=-4;px<=w+4;px+=Math.max(5,w/90)){
    const y=base+(fbm(px*freq+sd*11,sd*7,3)-.5)*amp+Math.sin(px*freq*3.7+sd)*amp*.12;
    g.lineTo(px,y);
  }
  g.lineTo(w+4,h+8); g.closePath();
}

/* ---------- papel: se hornea una vez y se reutiliza ---------- */
let paper=null;
function buildPaper(){
  const S=320, k=nc(S,S), g=k.getContext('2d');
  g.fillStyle='#8f8f8f'; g.fillRect(0,0,S,S);
  for(let i=0;i<S*S/26;i++){
    const v=118+R()*74|0;
    g.fillStyle='rgb('+v+','+v+','+v+')';
    g.fillRect(R()*S|0,R()*S|0,1,1);
  }
  g.lineWidth=1;
  for(let i=0;i<380;i++){
    const px=R()*S, py=R()*S, a=R()*TAU, l=4+R()*22, v=R()<.5?200:110;
    g.strokeStyle='rgba('+v+','+v+','+v+',.22)';
    g.beginPath(); g.moveTo(px,py); g.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l); g.stroke();
  }
  paper=k;
}

/* ============================================================
   FONDOS HORNEADOS: uno por momento del día
   ============================================================ */
const BG=[null,null,null];
let bw=0,bh=0,bs=1;
function bgCtx(i){
  if(!BG[i]) BG[i]=nc(bw,bh);
  const g=BG[i].getContext('2d');
  g.setTransform(bs,0,0,bs,0,0);
  return g;
}
const HY=()=>H*.545;

/* --- etapa A: cielo, astro, estrellas --- */
function bakeSky(i){
  const p=PAL[i], g=bgCtx(i); BLEND=p.dark?'source-over':'multiply';
  R=seedR(1000+i);
  const w=W,h=H,hy=HY();
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  g.fillStyle=p.field[0]; g.fillRect(-2,-2,w+4,h+4);
  const gr=g.createLinearGradient(0,0,0,hy*1.06);
  gr.addColorStop(0,p.sky[0]); gr.addColorStop(.45,p.sky[1]);
  gr.addColorStop(.8,p.sky[2]); gr.addColorStop(1,p.sky[3]);
  g.fillStyle=gr; g.fillRect(0,0,w,hy*1.08);
  R=seedR(55);
  for(let k=0;k<20;k++){
    const cx=R()*w, cy=R()*hy*.95, r=hy*(.18+R()*.4);
    const col=p.wet[k%p.wet.length];
    g.save(); g.globalCompositeOperation=p.dark?'source-over':'multiply';
    g.globalAlpha=.055+R()*.06; g.fillStyle=col;
    blobPath(g,cx,cy,r,.6,k*.37,.7,18); g.fill(); g.restore();
  }
  const o=p.orb, ox=w*o.x, oy=hy*o.y*1.7, orr=Math.min(w,h)*o.r;
  const hg=g.createRadialGradient(ox,oy,orr*.2,ox,oy,orr*4.2);
  hg.addColorStop(0,rgba(o.glow,o.ga)); hg.addColorStop(.4,rgba(o.glow,o.ga*.28));
  hg.addColorStop(1,rgba(o.glow,0));
  g.save(); g.globalCompositeOperation='lighter'; g.fillStyle=hg;
  g.fillRect(ox-orr*4.4,oy-orr*4.4,orr*8.8,orr*8.8); g.restore();
  g.save(); g.globalCompositeOperation='source-over';
  g.globalAlpha=.93; g.fillStyle=o.warm;
  blobPath(g,ox,oy,orr,.14,3.3,1,20); g.fill();
  if(i===2){
    g.globalCompositeOperation='destination-out'; g.globalAlpha=1;
    blobPath(g,ox+orr*.62,oy-orr*.36,orr*.8,.16,9.1,1,18); g.fill();
  }
  g.restore();
  if(p.star){
    R=seedR(909);
    g.save(); g.globalCompositeOperation='lighter';
    for(let k=0;k<190;k++){
      const px=R()*w, py=R()*hy*.9, r=R()*R()*1.7+.3;
      g.globalAlpha=.25+R()*.7; g.fillStyle=R()<.2?'#cfe0ff':'#fffdf2';
      g.beginPath(); g.arc(px,py,r,0,TAU); g.fill();
    }
    g.restore();
  }
  granul(bgCtx(i),0,0,w,hy,p.wet[0],p.dark?900:1700,.1);
}

/* --- etapa B: nubes, montaña, colinas, torii --- */
function bakeMid(i){
  const p=PAL[i], g=bgCtx(i); BLEND=p.dark?'source-over':'multiply';
  const w=W,h=H,hy=HY();
  R=seedR(300+i);
  for(let k=0;k<7;k++){
    const cx=(k*.17+.03)*w+(R()-.5)*w*.1, cy=hy*(.12+R()*.5), sc=hy*(.06+R()*.09);
    const lobes=3+(R()*3|0);
    for(let L=0;L<lobes;L++){
      const lx=cx+(L-lobes/2)*sc*.85, ly=cy+(R()-.5)*sc*.3, lr=sc*(.7+R()*.6);
      wash(g,(gg)=>blobPath(gg,lx,ly,lr,.5,k*2.1+L,.62,18),p.cloud.body,p.dark?.16:.13,3,sc*.09);
      wash(g,(gg)=>blobPath(gg,lx,ly+lr*.5,lr*.8,.55,k+L*3.3,.4,16),p.cloud.shade,.09,2,sc*.07);
      g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=p.dark?.10:.20;
      g.fillStyle=p.cloud.edge;
      blobPath(g,lx,ly-lr*.34,lr*.72,.5,k*3+L,.34,16); g.fill(); g.restore();
    }
  }
  R=seedR(77);
  const mx=w*.60, mb=hy*1.005, mh=hy*.44, mw=hy*.86;
  const mk=(gg)=>{gg.beginPath(); gg.moveTo(mx-mw,mb);
    for(let t=0;t<=1;t+=.06){
      const px=mx-mw+t*mw*2;
      const dd=Math.abs(px-mx)/mw;
      const py=mb-mh*Math.pow(1-dd,1.55)+(fbm(t*7+3,2,3)-.5)*mh*.05;
      gg.lineTo(px,py);
    }
    gg.lineTo(mx+mw,mb); gg.closePath();};
  wash(g,mk,p.mtn.rock,p.dark?.5:.3,3,2.4);
  wash(g,(gg)=>{gg.save();mk(gg);gg.clip();
      blobPath(gg,mx+mw*.5,mb-mh*.2,mw*.8,.4,4.2,.7,18);gg.restore();
      mk(gg);},p.mtn.shade,.16,2,2);
  g.save(); mk(g); g.clip(); g.globalCompositeOperation='source-over';
  g.globalAlpha=p.dark?.5:.85; g.fillStyle=p.mtn.snow;
  blobPath(g,mx,mb-mh*.93,mw*.36,.5,8.8,.55,20); g.fill();
  g.globalAlpha=p.dark?.3:.55;
  blobPath(g,mx-mw*.1,mb-mh*.74,mw*.2,.7,2.2,.4,18); g.fill(); g.restore();
  const fg=g.createLinearGradient(0,mb-mh*.42,0,mb+4);
  fg.addColorStop(0,rgba(p.mtn.mist,0)); fg.addColorStop(1,rgba(p.mtn.mist,p.dark?.75:.9));
  g.fillStyle=fg; g.fillRect(0,mb-mh*.42,w,mh*.44);
  for(let L=0;L<4;L++){
    const base=hy*(.985+L*.055), amp=hy*(.11-L*.018);
    wash(g,(gg)=>ridge(gg,w,h,base,amp,.0055+L*.0016,L+2.5),p.hill[L],p.dark?.55:.34,3,2.6);
    if(L<3){ g.save(); g.globalCompositeOperation='lighter';
      g.globalAlpha=p.dark?.05:.12; g.fillStyle=p.orb.glow;
      ridge(g,w,base+2,base,amp,.0055+L*.0016,L+2.5); g.fill(); g.restore(); }
  }
  const tw=hy*.20, tx=w*.185, ty=hy*1.055, th=tw*1.28;
  const tc=mix('#b8422e',p.hill[3],p.dark?.62:.14), td=mix(tc,'#3a1c14',.4);
  g.save(); g.globalAlpha=p.dark?.95:.92;
  g.globalCompositeOperation='source-over';
  const post=(px,wd)=>{g.fillStyle=tc;g.fillRect(px-wd/2,ty-th,wd,th);
    g.fillStyle=td;g.fillRect(px+wd*.18,ty-th,wd*.32,th);};
  post(tx-tw*.5,tw*.11); post(tx+tw*.5,tw*.11);
  g.fillStyle=tc; g.fillRect(tx-tw*.72,ty-th*.86,tw*1.44,tw*.10);
  g.beginPath(); g.moveTo(tx-tw*.86,ty-th*.99);
  g.quadraticCurveTo(tx,ty-th*1.14,tx+tw*.86,ty-th*.99);
  g.lineTo(tx+tw*.86,ty-th*.93); g.quadraticCurveTo(tx,ty-th*1.06,tx-tw*.86,ty-th*.93);
  g.closePath(); g.fill();
  g.fillStyle=mix('#7a5a34',p.hill[3],p.dark?.6:.1);
  g.fillRect(tx-tw*.10,ty-th*.82,tw*.20,tw*.16);
  g.restore();
}

/* --- etapa C: prado cercano, sendero y flores lejanas horneadas --- */
function bakeNear(i){
  const p=PAL[i], g=bgCtx(i); BLEND=p.dark?'source-over':'multiply';
  const w=W,h=H,hy=HY();
  for(let L=0;L<3;L++){
    const top=hy*(1.02+L*.06);
    wash(g,(gg)=>ridge(gg,w,h,top,hy*.05,.006+L*.002,L*3+9),p.field[L],p.dark?.6:.4,3,3);
  }
  granul(g,0,hy,w,h-hy,p.field[2],p.dark?800:2200,.13);
  R=seedR(31);
  const pk=(gg)=>{gg.beginPath();gg.moveTo(w*.47,hy*1.02);
    gg.bezierCurveTo(w*.44,hy*1.3,w*.30,h*.82,w*.16,h+10);
    gg.lineTo(w*.44,h+10);
    gg.bezierCurveTo(w*.56,h*.84,w*.53,hy*1.28,w*.505,hy*1.02);
    gg.closePath();};
  wash(g,pk,p.path,p.dark?.55:.42,3,3);
  g.save(); pk(g); g.clip();
  for(let k=0;k<26;k++){
    const t=k/26, yy=hy*1.04+(h-hy)*t*t*1.25;
    g.globalAlpha=.10+R()*.10; g.strokeStyle=p.pathS; g.lineWidth=1+t*3;
    g.beginPath(); g.moveTo(w*(.46-t*.34),yy); g.lineTo(w*(.52+t*.06),yy+2); g.stroke();
  }
  g.restore();
  R=seedR(4242);
  const N=700+ (QS===3?600:QS===2?330:110);
  g.save(); g.globalCompositeOperation='source-over';
  for(let k=0;k<N;k++){
    const t=Math.pow(R(),1.7);
    const py=hy*1.015+(h*1.02-hy)*t;
    const px=R()*w;
    const dp=(py-hy)/(h-hy);
    const r=(.6+dp*2.4)*(.7+R()*.7);
    const col=p.dots[R()*p.dots.length|0];
    g.globalAlpha=(p.dark?.34:.58)*(.45+R()*.55);
    g.fillStyle=col;
    g.beginPath(); g.ellipse(px,py,r,r*.82,R()*3,0,TAU); g.fill();
    if(r>2.2&&R()<.45){ g.globalAlpha*=.7; g.strokeStyle=p.stem2; g.lineWidth=Math.max(.6,r*.22);
      g.beginPath(); g.moveTo(px,py+r); g.lineTo(px+(R()-.5)*r,py+r*3.4); g.stroke(); }
  }
  g.restore();
  const ag=g.createLinearGradient(0,hy*.99,0,hy*1.22);
  ag.addColorStop(0,rgba(p.haze,p.hazeA*1.4)); ag.addColorStop(1,rgba(p.haze,0));
  g.fillStyle=ag; g.fillRect(0,hy*.99,w,hy*.24);
  if(paper){
    const pt=g.createPattern(paper,'repeat');
    g.save(); g.globalCompositeOperation='overlay'; g.globalAlpha=.34;
    g.fillStyle=pt; g.fillRect(0,0,w,h); g.restore();
  }
  const vg=g.createRadialGradient(w*.5,h*.46,Math.min(w,h)*.32,w*.5,h*.5,Math.max(w,h)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,p.dark?'rgba(4,8,22,.6)':'rgba(70,55,25,.30)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
}

/* ============================================================
   SPRITES por momento del día (pre-renderizados)
   ============================================================ */
const SPR=[null,null,null];
function petalShape(g,r,sd){
  g.beginPath(); g.moveTo(0,0);
  g.bezierCurveTo(r*.55,-r*.18,r*.92,-r*.5,r*1.0,-r*.06);
  g.bezierCurveTo(r*1.06,r*.42,r*.5,r*.5,0,r*.06);
  g.closePath();
}
function makeCorolla(p,S,vr){
  const k=nc(S,S), g=k.getContext('2d'), c=S/2, r=S*.40;
  R=seedR(500+vr*17);
  g.translate(c,c);
  const np=4+(vr%2);
  for(let i=0;i<np;i++){
    const a=i/np*TAU+vr*.4;
    g.save(); g.rotate(a);
    g.globalCompositeOperation='source-over';
    for(let pass=0;pass<3;pass++){
      g.save(); g.translate((R()-.5)*S*.03,(R()-.5)*S*.03);
      g.globalAlpha=.42; g.fillStyle=pass?p.fl.p2:p.fl.p1;
      petalShape(g,r*(1-pass*.16),i); g.fill(); g.restore();
    }
    g.globalAlpha=.5; g.strokeStyle=p.fl.edge; g.lineWidth=S*.012;
    petalShape(g,r,i); g.stroke();
    g.globalAlpha=.3; g.strokeStyle=p.fl.edge; g.lineWidth=S*.008;
    g.beginPath(); g.moveTo(r*.1,0); g.lineTo(r*.85,0); g.stroke();
    g.restore();
  }
  g.globalAlpha=.85; g.fillStyle=p.fl.core;
  blobPath(g,0,0,r*.24,.4,2.2,1,12); g.fill();
  g.globalAlpha=.5; g.fillStyle=p.fl.edge;
  for(let i=0;i<5;i++){const a=R()*TAU,d=r*.14;
    g.beginPath(); g.arc(Math.cos(a)*d,Math.sin(a)*d,r*.055,0,TAU); g.fill();}
  return k;
}
function makePetalSpr(p,S,vr){
  const k=nc(S,S), g=k.getContext('2d');
  R=seedR(800+vr*5);
  g.translate(S*.1,S*.5);
  for(let pass=0;pass<3;pass++){
    g.globalAlpha=.4; g.fillStyle=pass?p.fl.p2:p.petal;
    g.save(); g.translate((R()-.5)*2,(R()-.5)*2);
    petalShape(g,S*.8*(1-pass*.14),vr); g.fill(); g.restore();
  }
  g.globalAlpha=.45; g.strokeStyle=p.fl.edge; g.lineWidth=1;
  petalShape(g,S*.8,vr); g.stroke();
  return k;
}
function makeHero(p,S){
  const k=nc(S,S), g=k.getContext('2d'), c=S/2, r=S*.34;
  R=seedR(4141);
  g.translate(c,c);
  const ag=g.createRadialGradient(0,0,r*.2,0,0,r*1.5);
  ag.addColorStop(0,rgba(p.fl.p1,p.dark?.16:.28)); ag.addColorStop(1,rgba(p.fl.p1,0));
  g.fillStyle=ag; g.fillRect(-S/2,-S/2,S,S);
  for(let ring=0;ring<2;ring++){
    const rr=r*(ring?.72:1), np=ring?4:5;
    for(let i=0;i<np;i++){
      const a=i/np*TAU+(ring?.7:0);
      g.save(); g.rotate(a);
      for(let pass=0;pass<4;pass++){
        g.save(); g.translate((R()-.5)*S*.025,(R()-.5)*S*.025);
        g.rotate((R()-.5)*.08);
        g.globalAlpha=.3; g.fillStyle=pass<2?p.fl.p1:p.fl.p2;
        petalShape(g,rr*(1-pass*.1),i+ring); g.fill(); g.restore();
      }
      g.globalAlpha=.55; g.strokeStyle=p.fl.edge; g.lineWidth=S*.008;
      petalShape(g,rr,i+ring); g.stroke();
      g.globalAlpha=.28; g.lineWidth=S*.005;
      g.beginPath(); g.moveTo(rr*.12,0);
      g.quadraticCurveTo(rr*.5,-rr*.05,rr*.86,0); g.stroke();
      g.restore();
    }
  }
  g.globalAlpha=.9; g.fillStyle=p.fl.core;
  blobPath(g,0,0,r*.2,.35,5.5,1,14); g.fill();
  for(let i=0;i<9;i++){
    const a=i/9*TAU+.3, d=r*(.12+R()*.16);
    g.globalAlpha=.75; g.strokeStyle=p.fl.edge; g.lineWidth=S*.007;
    g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(a)*d,Math.sin(a)*d); g.stroke();
    g.globalAlpha=.85; g.fillStyle=mix(p.fl.core,'#ffffff',p.dark?.2:.45);
    g.beginPath(); g.arc(Math.cos(a)*d,Math.sin(a)*d,S*.012,0,TAU); g.fill();
  }
  return k;
}
function makeGlow(col){
  const S=64,k=nc(S,S),g=k.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,rgba(col,.9)); gr.addColorStop(.35,rgba(col,.3));
  gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr; g.fillRect(0,0,S,S);
  return k;
}
function buildSprites(i){
  const p=PAL[i], base=Math.max(34,Math.min(W,H)*.055);
  const s={cor:[],pet:[]};
  for(let v=0;v<6;v++) s.cor.push(makeCorolla(p,Math.round(base*(.7+v*.12)),v));
  for(let v=0;v<4;v++) s.pet.push(makePetalSpr(p,Math.round(base*.4),v));
  s.hero=makeHero(p,Math.round(Math.min(W,H)*(W<560?.42:.30)));
  s.glow=makeGlow(i===2?'#dfff9a':p.fl.p1);
  SPR[i]=s;
}

/* ============================================================
   ESCENA VIVA: ramo, viento, pétalos, luciérnagas
   ============================================================ */
let T=0.7;
let mode='auto', target=null;
const CYCLE=66;
let bouquet=[], leaves=[], grass=[], petals=[], flies=[], gusts=[];
let tiltX=0, tiltY=0, tX=0, tY=0, gyroOn=false, gyroAsked=false;

/* ---------- construcción del RAMO ---------- */
function initBouquet(){
  R=seedR(9090);
  const N = QS===3?27 : QS===2?19 : 13;
  bouquet=[];
  for(let i=0;i<N;i++){
    const a=i*2.39996323;
    const rr=Math.sqrt((i+.5)/N);
    const ex=Math.cos(a)*rr, ey=Math.sin(a)*rr;
    const depth=clamp(ey*.9+(R()-.5)*.5,-1,1);
    bouquet.push({
      ex:ex, ey:ey, depth:depth,
      s:.72+(depth*.5+.5)*.62,
      v:R()*6|0,
      ph:R()*TAU,
      sw:.6+R()*.9,
      tilt:(R()-.5)*.6,
      twist:(R()-.5)*1.4,
      px:0, py:0, rot:0, bx:0
    });
  }
  bouquet.sort((p,q)=>p.depth-q.depth);
  const nl = QS===3?12 : QS===2?9 : 6;
  leaves=[];
  for(let i=0;i<nl;i++){
    const t=nl===1?0:(i/(nl-1))*2-1;
    leaves.push({
      ang: t*1.25 + (R()-.5)*.22,
      len: .40+R()*.40,
      ph: R()*TAU,
      sz:  .60+R()*.55
    });
  }
  const q=QCFG[QS], hy=HY();
  R=seedR(9090);
  grass=[];
  for(let i=0;i<q.gr;i++){
    const d=Math.pow(R(),.8);
    grass.push({x:R()*W, y:hy*1.04+(H*1.08-hy)*d, h:(6+d*46)*(.6+R()*.8),
      a:(R()-.5)*.5, ph:R()*TAU, w:d>.55?1:0});
  }
  flies=[];
  for(let i=0;i<q.ff;i++)
    flies.push({x:R()*W, y:hy*1.0+R()*(H-hy)*.95, ph:R()*TAU,
      sp:.25+R()*.5, r:6+R()*10, bl:.4+R()*.6});
  petals=[];
}
function spawnPetals(px,py,n){
  const q=QCFG[QS];
  for(let i=0;i<n && petals.length<q.pt*3;i++)
    petals.push({x:px+(R()-.5)*40, y:py+(R()-.5)*30,
      vx:(R()-.5)*1.4, vy:-.6-R()*1.2, r:R()*TAU, vr:(R()-.5)*.12,
      s:.6+R()*.8, life:1, v:R()*4|0});
}
function windAt(px,py,t){
  let w=Math.sin(px*.0075+t*1.15)*.28+Math.sin(px*.019-t*1.9)*.13
       +Math.sin(py*.02+t*.7)*.07;
  w+=tiltX*.5;
  for(let i=0;i<gusts.length;i++){
    const g=gusts[i], dx=px-g.x, dy=(py-g.y)*1.8, d2=dx*dx+dy*dy, rr=g.r*g.r;
    if(d2<rr) w+=g.p*(1-d2/rr)*(1-g.t);
  }
  return w;
}
function pushGust(px,py,p){
  if(gusts.length>10) gusts.shift();
  gusts.push({x:px,y:py,r:Math.min(W,H)*.28,p:p,t:0});
}
function leafPath(g,ox,oy,ang,len,wid,bend){
  const ex=ox+Math.sin(ang)*len, ey=oy-Math.cos(ang)*len;
  const mx=(ox+ex)/2+Math.cos(ang)*bend;
  const my=(oy+ey)/2+Math.sin(ang)*bend;
  const dx=ex-ox, dy=ey-oy, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L;
  g.beginPath();
  g.moveTo(ox,oy);
  g.quadraticCurveTo(mx+nx*wid,my+ny*wid,ex,ey);
  g.quadraticCurveTo(mx-nx*wid,my-ny*wid,ox,oy);
  g.closePath();
}

/* ============================================================
   BUCLE
   ============================================================ */
let last=0, tt=0, showText=true, fps=60, slow=0, frames=0;
const smooth=(v)=>v*v*(3-2*v);

function draw(now){
  requestAnimationFrame(draw);
  if(!ready) return;
  const dt=Math.min(.05,(now-last)/1000||.016); last=now;
  tt+=dt;
  if(mode==='auto') T=(T+dt*3/CYCLE)%3;
  else{
    let d=target-T; if(d>1.5)d-=3; if(d<-1.5)d+=3;
    const st=Math.sign(d)*Math.min(Math.abs(d),dt*.85);
    T=(T+st+3)%3;
  }
  const i0=Math.floor(T)%3, i1=(i0+1)%3, b=smooth(T-Math.floor(T));
  const pa=PAL[i0], pb=PAL[i1];
  const nightW=Math.max(0,1-Math.min(Math.abs(T-2),Math.abs(T-2-3),Math.abs(T-2+3)));
  tiltX+=(tX-tiltX)*Math.min(1,dt*4.5);
  tiltY+=(tY-tiltY)*Math.min(1,dt*4.5);

  /* --- 1. fondo horneado con parallax --- */
  const ox=-W*.03-tiltX*W*.022, oy=-H*.028-tiltY*H*.016;
  x.globalAlpha=1; x.globalCompositeOperation='source-over';
  x.drawImage(BG[i0],ox,oy,W*1.06,H*1.056);
  if(b>.004){ x.globalAlpha=b; x.drawImage(BG[i1],ox,oy,W*1.06,H*1.056); x.globalAlpha=1; }

  const hy=HY();
  const stemC=mix(pa.stem,pb.stem,b), stem2C=mix(pa.stem2,pb.stem2,b);
  const sA=SPR[i0], sB=SPR[i1];

  /* --- 2. prado de fondo --- */
  for(let pass=0;pass<2;pass++){
    x.strokeStyle=pass?stem2C:stemC;
    x.globalAlpha=pass?.42:.30;
    x.lineWidth=pass?1.6:1;
    x.beginPath();
    for(let i=0;i<grass.length;i++){
      const g=grass[i]; if(g.w!==pass) continue;
      const w=windAt(g.x,g.y,tt)+Math.sin(tt*1.7+g.ph)*.1;
      x.moveTo(g.x,g.y);
      x.quadraticCurveTo(g.x+g.a*8+w*g.h*.35,g.y-g.h*.6,
                         g.x+g.a*14+w*g.h*.9,g.y-g.h);
    }
    x.stroke();
  }

  /* ============================================================
     3. EL RAMO — geometría común
     ============================================================ */
  const bxp = W*(W<560?.44:.44);
  const byp = H*1.03;
  const BL  = H*(W<560?.68:.74);
  const sway = tiltX*.85 + Math.sin(tt*.75)*.06 + windAt(bxp,byp-BL*.6,tt)*.42;
  const ccx  = bxp + sway*BL*.15;
  const ccy  = byp - BL*.80 - tiltY*H*.013;
  const cRx  = BL*(W<560?.37:.35);
  const cRy  = BL*.27;

  for(let i=0;i<bouquet.length;i++){
    const f=bouquet[i];
    const iw=windAt(ccx+f.ex*cRx, ccy+f.ey*cRy, tt)*f.sw;
    f.px  = ccx + f.ex*cRx + iw*BL*.055 + sway*f.twist*BL*.045;
    f.py  = ccy + f.ey*cRy + Math.abs(sway)*BL*.018;
    f.rot = f.tilt + iw*.30 + Math.sin(tt*1.5+f.ph)*.06;
    f.bx  = bxp + f.ex*BL*.05;
  }

  for(let pass=0;pass<2;pass++){
    x.strokeStyle=pass?stem2C:stemC;
    x.globalAlpha=pass?.48:.70;
    x.lineWidth=Math.max(1.2,BL*(pass?.007:.012));
    x.lineCap='round';
    x.beginPath();
    for(let i=0;i<bouquet.length;i++){
      const f=bouquet[i];
      const mx=(f.bx+f.px)*.5 + sway*BL*.05*(1-Math.abs(f.ex)*.6);
      const my=(byp+f.py)*.5;
      x.moveTo(f.bx,byp);
      x.quadraticCurveTo(mx,my,f.px,f.py);
    }
    x.stroke();
  }

  for(let i=0;i<leaves.length;i++){
    const lf=leaves[i];
    const iw=windAt(bxp,byp-BL*.5,tt)*.35;
    const ang=lf.ang + sway*.22 + iw*.10 + Math.sin(tt*1.1+lf.ph)*.05;
    const ox2=bxp+Math.sin(lf.ang)*BL*.055;
    const oy2=byp-BL*.44;
    const len=BL*lf.len;
    x.globalAlpha=.52; x.fillStyle=stemC;
    leafPath(x,ox2,oy2,ang,len,BL*.045*lf.sz,BL*.09*lf.sz);
    x.fill();
    x.globalAlpha=.30; x.strokeStyle=stem2C; x.lineWidth=1;
    leafPath(x,ox2,oy2,ang,len,BL*.045*lf.sz,BL*.09*lf.sz);
    x.stroke();
  }
  x.globalAlpha=1;

  /* --- papel de envoltura --- */
  const wTop = byp - BL*.40;
  const wHW  = BL*.30;
  const wBW  = BL*.070;
  const wc1  = mix(pa.wrap.a, pb.wrap.a, b);
  const wc2  = mix(pa.wrap.b, pb.wrap.b, b);
  const wcr  = mix(pa.wrap.r, pb.wrap.r, b);

  x.save();
  x.beginPath();
  x.moveTo(bxp-wBW, byp+H*.03);
  x.bezierCurveTo(bxp-wHW*.50, byp-BL*.15, bxp-wHW*.92, wTop+BL*.06, bxp-wHW, wTop);
  x.quadraticCurveTo(bxp-wHW*.50, wTop+BL*.060, bxp, wTop+BL*.085);
  x.quadraticCurveTo(bxp+wHW*.50, wTop+BL*.060, bxp+wHW, wTop);
  x.bezierCurveTo(bxp+wHW*.92, wTop+BL*.06, bxp+wHW*.50, byp-BL*.15, bxp+wBW, byp+H*.03);
  x.closePath();
  const wg=x.createLinearGradient(bxp-wHW,0,bxp+wHW,0);
  wg.addColorStop(0,wc2); wg.addColorStop(.30,wc1);
  wg.addColorStop(.66,wc1); wg.addColorStop(1,wc2);
  x.globalAlpha=.95; x.fillStyle=wg; x.fill();
  x.globalAlpha=.28; x.strokeStyle=wc2; x.lineWidth=1.2; x.stroke();
  x.globalAlpha=.15; x.strokeStyle=wc2; x.lineWidth=1.1;
  x.beginPath();
  for(let k=-3;k<=3;k++){
    if(!k) continue;
    const t=k/3;
    x.moveTo(bxp+t*wBW*1.2, byp);
    x.lineTo(bxp+t*wHW*.95, wTop+BL*.035);
  }
  x.stroke();
  x.globalAlpha=.13; x.fillStyle='#ffffff';
  x.beginPath();
  x.moveTo(bxp-wHW*.86, wTop+BL*.02);
  x.quadraticCurveTo(bxp-wHW*.55, wTop+BL*.30, bxp-wHW*.34, wTop+BL*.70);
  x.lineTo(bxp-wHW*.62, wTop+BL*.70);
  x.quadraticCurveTo(bxp-wHW*.78, wTop+BL*.30, bxp-wHW*.98, wTop+BL*.03);
  x.closePath(); x.fill();
  x.restore();

  /* --- lazo --- */
  const yR  = byp - BL*.17;
  const rHW = wBW + (wHW-wBW)*.20;
  const rTh = BL*.023;
  x.save();
  x.globalAlpha=.95; x.fillStyle=wcr;
  x.beginPath();
  x.moveTo(bxp-rHW, yR-rTh);
  x.lineTo(bxp+rHW, yR-rTh);
  x.lineTo(bxp+rHW*1.05, yR+rTh);
  x.lineTo(bxp-rHW*1.05, yR+rTh);
  x.closePath(); x.fill();
  x.globalAlpha=.25; x.strokeStyle=wc2; x.lineWidth=1; x.stroke();
  x.translate(bxp, yR-rTh*.35);
  for(let s=-1;s<=1;s+=2){
    x.save(); x.rotate(s*.60);
    x.globalAlpha=.96; x.fillStyle=wcr;
    x.beginPath(); x.ellipse(s*rTh*1.7, -rTh*.15, rTh*1.85, rTh*1.05, 0,0,TAU);
    x.fill();
    x.globalAlpha=.28; x.strokeStyle=wc2; x.lineWidth=1; x.stroke();
    x.restore();
  }
  x.globalAlpha=1; x.fillStyle=wcr;
  x.beginPath(); x.arc(0,0,rTh*.72,0,TAU); x.fill();
  for(let s=-1;s<=1;s+=2){
    x.save(); x.rotate(s*.35);
    x.globalAlpha=.92; x.fillStyle=wcr;
    x.beginPath();
    x.moveTo(-rTh*.35,0); x.lineTo(rTh*.35,0);
    x.lineTo(rTh*.20,BL*.15); x.lineTo(-rTh*.55,BL*.13);
    x.closePath(); x.fill();
    x.restore();
  }
  x.restore();
  x.globalAlpha=1;

  /* --- flores del ramo --- */
  for(let i=0;i<bouquet.length;i++){
    const f=bouquet[i];
    const spA=sA.cor[f.v], sz=spA.width*f.s*1.45;
    x.save(); x.translate(f.px,f.py); x.rotate(f.rot);
    x.globalAlpha=1; x.drawImage(spA,-sz/2,-sz/2,sz,sz);
    if(b>.05){ x.globalAlpha=b; x.drawImage(sB.cor[f.v],-sz/2,-sz/2,sz,sz); }
    x.restore();
  }
  x.globalAlpha=1;

  /* --- flor protagonista --- */
  const hxp=ccx+sway*BL*.03, hyp=ccy+cRy*.22;
  const hs=sA.hero.width*(W<560?.92:1.0);
  x.save(); x.translate(hxp,hyp);
  x.rotate(sway*.35+Math.sin(tt*1.3)*.03);
  x.globalAlpha=1; x.drawImage(sA.hero,-hs/2,-hs/2,hs,hs);
  if(b>.05){ x.globalAlpha=b; x.drawImage(sB.hero,-hs/2,-hs/2,hs,hs); }
  x.globalAlpha=.10+nightW*.22; x.globalCompositeOperation='lighter';
  x.drawImage(sA.glow,-hs*.42,-hs*.42,hs*.84,hs*.84);
  x.restore();
  x.globalCompositeOperation='source-over'; x.globalAlpha=1;

  /* --- pétalos sueltos --- */
  for(let i=petals.length-1;i>=0;i--){
    const p=petals[i];
    const w=windAt(p.x,p.y,tt);
    p.vx+=(w*.6-p.vx)*.05; p.vy+=.028; p.vy*=.995;
    p.x+=p.vx*1.6; p.y+=p.vy*1.6; p.r+=p.vr+w*.02; p.life-=.0022;
    if(p.life<=0||p.y>H+40||p.x<-60||p.x>W+60){ petals.splice(i,1); continue; }
    const sp=sA.pet[p.v], sz=sp.width*p.s*1.5;
    x.save(); x.translate(p.x,p.y); x.rotate(p.r);
    x.globalAlpha=Math.min(1,p.life*1.4);
    x.drawImage(sp,-sz*.3,-sz*.5,sz,sz);
    x.restore();
  }
  x.globalAlpha=1;

  /* --- luciérnagas --- */
  if(nightW>.02){
    x.globalCompositeOperation='lighter';
    for(let i=0;i<flies.length;i++){
      const f=flies[i];
      f.x+=Math.cos(tt*f.sp+f.ph)*.8+tiltX*.6;
      f.y+=Math.sin(tt*f.sp*1.3+f.ph*2)*.5;
      if(f.x<-20)f.x=W+20; if(f.x>W+20)f.x=-20;
      const pulse=.35+.65*Math.abs(Math.sin(tt*1.6*f.bl+f.ph));
      x.globalAlpha=nightW*pulse*.85;
      x.drawImage(sA.glow,f.x-f.r,f.y-f.r,f.r*2,f.r*2);
    }
    x.globalCompositeOperation='source-over'; x.globalAlpha=1;
  }

  for(let i=gusts.length-1;i>=0;i--){ gusts[i].t+=dt*.55; if(gusts[i].t>=1) gusts.splice(i,1); }

  frames++;
  if(frames%12===0){
    fps=fps*.7+(1/dt)*.3;
    const lab=PAL[Math.round(T)%3].label;
    if(hud.textContent!==lab) hud.textContent=lab;
    document.body.classList.toggle('dark',nightW>.45);
    if(fps<42){ slow++; if(slow>10&&QS>1){ setQ(QS-1); slow=0; } } else slow=0;
  }
}

/* ============================================================
   CONSTRUCCIÓN ASÍNCRONA
   ============================================================ */
const bar=document.getElementById('bar'), loadEl=document.getElementById('load'),
      hud=document.getElementById('hud'), panel=document.getElementById('panel'),
      hint=document.getElementById('hint');
let ready=false, steps=[], si=0;

function resize(){
  const q=QCFG[QS];
  DPR=Math.min(window.devicePixelRatio||1,q.dpr);
  W=Math.max(320,window.innerWidth); H=Math.max(420,window.innerHeight);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0);
  bs=Math.min(DPR,1.3); bw=Math.round(W*bs); bh=Math.round(H*bs);
  BG[0]=BG[1]=BG[2]=null;
}
function buildAll(){
  ready=false; si=0; loadEl.style.display='flex'; loadEl.style.opacity='1';
  steps=[
    ()=>{ resize(); if(!paper) buildPaper(); },
    ()=>bakeSky(0), ()=>bakeMid(0), ()=>bakeNear(0),
    ()=>bakeSky(1), ()=>bakeMid(1), ()=>bakeNear(1),
    ()=>bakeSky(2), ()=>bakeMid(2), ()=>bakeNear(2),
    ()=>buildSprites(0), ()=>buildSprites(1), ()=>buildSprites(2),
    ()=>{ initBouquet(); }
  ];
  requestAnimationFrame(tickBuild);
}
function tickBuild(){
  const t0=performance.now();
  while(si<steps.length && performance.now()-t0<14){ steps[si++](); }
  bar.style.width=(si/steps.length*100).toFixed(0)+'%';
  if(si<steps.length){ requestAnimationFrame(tickBuild); return; }
  ready=true; last=performance.now();
  loadEl.style.opacity='0';
  setTimeout(()=>{loadEl.style.display='none';},750);
  setTimeout(()=>{hint.style.opacity='0';},7000);
}
function setQ(q){ if(q===QS) return; QS=q; buildAll(); }

/* ============================================================
   ENTRADA: giroscopio, dedo, ratón, teclado
   ============================================================ */
function applyTilt(gamma,beta){
  if(gamma==null) return;
  gyroOn=true;
  tX=clamp(gamma/32,-1,1);
  tY=clamp((beta-42)/40,-1,1);
  pushGust(W*(.5+tX*.4),H*(.55+tY*.2),tX*.35);
}
function onOri(e){
  let g=e.gamma, b=e.beta;
  if(g==null && e.accelerationIncludingGravity){
    g=-e.accelerationIncludingGravity.x*4; b=e.accelerationIncludingGravity.y*4+42;
  }
  if(window.orientation===90) { const t=g; g=b-42; b=-t+42; }
  else if(window.orientation===-90){ const t=g; g=-(b-42); b=t+42; }
  applyTilt(g,b);
}
function listenOri(){
  window.addEventListener('deviceorientation',onOri,{passive:true});
  window.addEventListener('devicemotion',(e)=>{ if(!gyroOn) onOri(e); },{passive:true});
}
const gyroBtn=document.getElementById('gyro');
function askGyro(){
  gyroAsked=true;
  const D=window.DeviceOrientationEvent;
  if(D && typeof D.requestPermission==='function'){
    D.requestPermission().then(r=>{
      if(r==='granted'){ listenOri(); gyroBtn.classList.add('on'); gyroBtn.textContent='sensor ✓'; }
      else gyroBtn.textContent='sin permiso';
    }).catch(()=>{ gyroBtn.textContent='no disponible'; });
  } else if(D){
    listenOri(); gyroBtn.classList.add('on'); gyroBtn.textContent='sensor ✓';
  } else gyroBtn.textContent='no disponible';
}
gyroBtn.addEventListener('click',askGyro);
if(window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission!=='function') listenOri();

document.querySelectorAll('#ui .btn[data-m]').forEach(bt=>{
  bt.addEventListener('click',()=>{
    document.querySelectorAll('#ui .btn[data-m]').forEach(o=>o.classList.remove('on'));
    bt.classList.add('on');
    const m=bt.dataset.m;
    if(m==='auto'){ mode='auto'; }
    else { mode='fixed'; target=+m; }
  });
});
cv.addEventListener('pointermove',(e)=>{
  if(!gyroOn){ tX=(e.clientX/W-.5)*2; tY=(e.clientY/H-.5)*1.4; }
  if(R()<.35) pushGust(e.clientX,e.clientY,(e.clientX/W-.5)*.7+.2);
},{passive:true});
cv.addEventListener('pointerdown',(e)=>{
  spawnPetals(e.clientX,e.clientY,7); pushGust(e.clientX,e.clientY,.55);
  if(!gyroAsked && window.DeviceOrientationEvent &&
     typeof window.DeviceOrientationEvent.requestPermission==='function') askGyro();
},{passive:true});
addEventListener('keydown',(e)=>{
  const k=e.key.toLowerCase();
  if(k==='h'){ showText=!showText;
    panel.style.opacity=showText?'1':'0'; hud.style.opacity=showText?'1':'0';
    document.getElementById('ui').style.opacity=showText?'1':'0'; }
  if(k==='d'){ mode='fixed'; target=0; }
  if(k==='t'){ mode='fixed'; target=1; }
  if(k==='n'){ mode='fixed'; target=2; }
  if(k==='a'){ mode='auto'; }
  if(k==='1'||k==='2'||k==='3') setQ(+k);
});
let rt=null;
addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(buildAll,320); });
addEventListener('orientationchange',()=>{ clearTimeout(rt); rt=setTimeout(buildAll,420); });

/* arranque */
(function boot(){
  const small=Math.min(innerWidth,innerHeight)<520, cores=navigator.hardwareConcurrency||4;
  QS = small||cores<=4 ? (cores<=2?1:2) : 3;
  buildAll();
  requestAnimationFrame(draw);
})();
</script>
